<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yankee Tabuľky</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2457d6">
</head>
<body>
<header class="topbar sheet">
  <a class="brand" href="index.html" title="Späť na prehľad">◀ Yankee Tabuľky</a>
  <input class="title-input" id="title" aria-label="Názov zošita">
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <span id="driveSlot" style="display:contents"></span>
  <button class="tb-btn" id="new">Nový</button>
  <label class="tb-btn">Otvoriť<input type="file" id="open" accept=".xlsx,.xlsm,.xls,.ods,.csv,.tsv" hidden></label>
  <select class="tb-btn" id="export" aria-label="Stiahnuť">
    <option value="">Stiahnuť ako…</option>
    <option value="xlsx">Excel (.xlsx)</option>
    <option value="ods">OpenDocument (.ods)</option>
    <option value="csv">CSV (.csv)</option>
    <option value="pdf">PDF / Tlač</option>
  </select>
</header>

<div class="toolbar">
  <button id="undo" title="Späť (Ctrl+Z)">↶</button>
  <button id="redo" title="Znova (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <button data-style="b" title="Tučné (Ctrl+B)"><b>B</b></button>
  <button data-style="i" title="Kurzíva (Ctrl+I)"><i>I</i></button>
  <button data-style="u" title="Podčiarknuté (Ctrl+U)"><u>U</u></button>
  <span class="lbl">A</span><input type="color" id="color" value="#000000" title="Farba textu">
  <span class="lbl">▮</span><input type="color" id="fill" value="#ffffff" title="Farba výplne">
  <span class="sep"></span>
  <button data-align="left" title="Vľavo">⯇</button>
  <button data-align="center" title="Na stred">≡</button>
  <button data-align="right" title="Vpravo">⯈</button>
  <span class="sep"></span>
  <select id="fmt" title="Formát čísla">
    <option value="">Všeobecný</option>
    <option value="n2">Číslo 0,00</option>
    <option value="eur">Mena €</option>
    <option value="pct">Percentá %</option>
  </select>
  <span class="sep"></span>
  <button id="sum" title="Automatický súčet">Σ</button>
  <button id="chart" title="Vložiť graf z vybraných buniek">📊 Graf</button>
  <button id="sortAsc" title="Zoradiť stĺpec vzostupne">A→Z</button>
  <button id="sortDesc" title="Zoradiť stĺpec zostupne">Z→A</button>
  <button id="clear" title="Vymazať výber (Delete)">⌫</button>
  <button id="help" title="Zoznam funkcií">ƒ?</button>
</div>

<div class="formula-bar">
  <div class="cell-name" id="cellName">A1</div>
  <span class="fx">fx</span>
  <input id="fbar" spellcheck="false" aria-label="Obsah bunky">
</div>

<div class="grid-wrap" id="gridWrap"><table class="grid" id="grid"></table></div>

<div class="sheet-tabs" id="tabs"></div>

<script src="js/storage.js"></script>
<script src="js/formula.js"></script>
<script src="js/docx.js"></script>
<script src="js/xlsxio.js"></script>
<script src="js/charts.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/sheet.js"></script>
</body>
</html>
